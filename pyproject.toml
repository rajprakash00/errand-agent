[project]
name = "errand-agent"
version = "0.1.0"
description = "Offline, deterministic errand booking agent with a code-enforced approval kernel"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30",
]

[project.scripts]
errand = "errand_agent.cli:main"

[project.urls]
Repository = "https://github.com/rajprakash00/errand-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errand_agent"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
