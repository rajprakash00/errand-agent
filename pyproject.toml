[project]
name = "errand-agent"
version = "0.1.0"
description = "Offline, deterministic errand booking agent with a code-enforced approval kernel"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
]

[project.scripts]
errand = "errand_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errand_agent"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
